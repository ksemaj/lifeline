# Used by Lifeline to update old configs. Don't change it.
config-version: 4

# ─────────────────────────────────────────────
#  Lifeline — if one player dies, everyone dies.
#  Messages use MiniMessage: https://docs.advntr.dev/minimessage/format
# ─────────────────────────────────────────────

# Only players in these game modes are part of the link (creative/spectator are left alone).
affected-gamemodes: [SURVIVAL, ADVENTURE]

cascade:
  # Ticks to wait after the first death before everyone else falls (20 ticks = 1 second).
  delay-ticks: 10
  # Harmless lightning effect on every player who falls with them.
  lightning-effect: true
  # Deaths within this many seconds of a cascade don't start another one.
  cooldown-seconds: 5
  # After a wipe, start the next attempt straight away with the same players (false = wait for
  # /lifeline start). A new world (world-reset) always waits for /lifeline start.
  auto-continue: true

# Who plays: everyone online and not opted out when an admin runs /lifeline start. Opting in or
# out only works between runs. Admins can change a running roster with /lifeline add|remove.
# Someone who joins after the start: SPECTATE (watch this run, play the next) or BLOCK (can't
# join until the run ends; ops always can).
late-joiners: SPECTATE

low-health:
  # Health points (2 points = 1 heart). At or below this, everyone gets an action bar warning.
  warn-at: 6.0
  # At or below this the warning turns red and pulses.
  critical-at: 3.0
  # How often (in ticks) each player's health is checked and the action bar refreshed.
  check-interval-ticks: 10
  # Play a heartbeat sound to everyone when somebody new drops low.
  alert-sound: true
  # On/off switches in this file are only defaults: change them in-game with /lifeline settings,
  # which saves to data.yml. Each player can also hide warnings, arrows and the heartbeat for
  # themselves under My settings.
  # Show an arrow and distance to each player in danger on the action bar.
  compass: true
  # Also point real compass items at the nearest player in danger (reset to spawn afterwards).
  compass-item: true

damage-sharing:
  # Default for new servers. After that, /lifeline sharing on|off|<percent> changes it and it is saved.
  enabled: false
  # Share of each hit that every other linked player also takes (0.25 = a quarter).
  fraction: 0.25

protection:
  # Logging out during a run while in combat or on critical health counts as dying (and wipes
  # everyone). Being kicked never counts.
  combat-log: true
  # How long after a hit someone counts as "in combat".
  combat-seconds: 10
  # No penalty for this long after dying, respawning, joining or a wipe.
  grace-seconds: 30

afk:
  # Mark idle players AFK (shown in the tab list). The timer pauses when everyone is AFK.
  flag: true
  flag-minutes: 5
  # Kick players idle this long while a run is going. Permission lifeline.afk.exempt skips it.
  kick: true
  kick-minutes: 15
  # Hostile mobs ignore players who are AFK (and drop them as a target when they go AFK).
  mobs-ignore: true

# One /tpa per player per run; the other player clicks [Accept] or [Deny]. Off by default.
tpa:
  enabled: false

# /coords posts your coordinates in chat for everyone (10 second cooldown).
coords:
  enabled: true

world-reset:
  # After a wipe: kick everyone, shut down, and come back on a brand-new world.
  # On hardcore servers this defaults to on (everyone is a spectator after a wipe otherwise).
  # The server only restarts by itself if it runs in a restart loop (start.sh / start.bat).
  enabled: false
  # Seconds after the wipe summary before the countdown starts, and the countdown length.
  delay-seconds: 8
  countdown-seconds: 3
  # Put a random seed in server.properties so each attempt gets a different world.
  new-seed: true
  # Old worlds are moved to world-backups/ and the newest ones kept. 0 = delete them outright.
  keep-backups: 2

victory:
  # What wins a run: DRAGON, WITHER, EITHER or NONE (endless). Changeable in /lifeline settings.
  goal: DRAGON

tab-list:
  # Name, afk, hearts, and the dimension when not in the overworld. Attempt and timer on top.
  enabled: true

# "afk" and hearts next to names above heads (scoreboard teams). Paper only: Folia has no
# scoreboard API. Players already on another plugin's team are left alone.
nametag:
  enabled: true

stats:
  # After every wipe or win: a results bar across the top of the screen (works on the hardcore
  # game-over screen and in spectator) plus a short chat card; /stats shows the full breakdown.
  enabled: true
  # How long the results bar stays up.
  bar-seconds: 90
  # Ticks after the wipe before the summary appears.
  summary-delay-ticks: 60
  # How many past wipes to keep.
  history-size: 20

opt-out:
  # Seconds a player must wait between changing their own opt status.
  cooldown-seconds: 30

sounds:
  victory: "ui.toast.challenge_complete"
  countdown: "block.note_block.hat"
  start: "entity.ender_dragon.growl"
  cascade: "entity.wither.spawn"
  low-health: "block.note_block.basedrum"
  opt-in: "block.respawn_anchor.charge"
  opt-out: "block.respawn_anchor.deplete"

